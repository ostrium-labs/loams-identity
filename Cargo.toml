# Workspace layout: spec/01-architecture.md section 2. Dependency direction: ARCH-3.
[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/events",
    "crates/store-redb",
    "crates/store-postgres",
    "crates/oidc",
    "crates/authn",
    "crates/federation",
    "crates/api-rest",
    "crates/api-grpc",
    "crates/login-ui",
    "crates/runtime",
    "crates/cli",
    "crates/sim",
    "crates/conformance",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/ostrium-labs/loams-identity"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Determinism lint (ARCH-7, ARCH-8, ADR 0016). The lists live in clippy.toml. Crates that ADR 0016
# exempts (runtime, cli, the store crates, test code) allow these two lints in their crate root.
disallowed_methods = "deny"
disallowed_types = "deny"
# ARCH-12: no unwrap, expect or panic outside tests (see clippy.toml for the test allowances).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
